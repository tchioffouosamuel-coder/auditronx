[env:esp32dev_borne]
platform = espressif32
; ESP32 générique (DevKit, pas de caméra ni de PSRAM requis) : variante
; "légère" de esp32_borne/, même logique BLE + WiFi STA + file persistante +
; sync API, sans preuve photo. Adapter `board` au module exact si besoin.
board = esp32dev
; Schéma par défaut (deux slots OTA de 1.25 Mo) laissait le firmware à >95%
; de la partition app — quasi aucune marge pour la moindre évolution.
; partitions.csv : deux slots OTA de 1.5 Mo (mises à jour à distance depuis
; le backoffice, voir checkForUpdate() dans main.cpp) + LittleFS ~900 Ko.
; Remplace huge_app.csv (pas d'OTA) : le passage de l'un à l'autre impose un
; flash USB. La partition LittleFS garde le même offset/taille (0x310000,
; 0xE0000) dans les deux tables : la file en attente survit au changement.
board_build.partitions = partitions.csv
framework = arduino
monitor_speed = 115200
build_flags =
    ; Pile de la tâche loop() par défaut (8 Ko) insuffisante pour la poignée
    ; de main TLS de mbedTLS (syncWithApi() vers l'API en HTTPS) combinée aux
    ; buffers JSON locaux — voir esp32_borne/platformio.ini, même cause.
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    ; NimBLE allégé : la borne n'est que périphérique (serveur GATT), et ne
    ; traite qu'un téléphone à la fois (les tampons d'assemblage d'un scan
    ; sont uniques). Rôles central/observateur et connexions multiples
    ; retirés : autant de RAM rendue au tas, donc au TLS.
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    ; Serveur BLE local (§hardware) : transport téléphone<->borne. NimBLE
    ; plutôt que le BLE bluedroid natif d'Arduino-ESP32 : bien plus léger en
    ; RAM/flash.
    h2zero/NimBLE-Arduino @ ^1.4.3
