; Port ESP32-S3 de esp32dev_borne/ (même logique : serveur BLE + WiFi STA +
; file persistante + synchro API + OTA + moniteur série à distance, pas de
; caméra embarquée — le selfie arrive du téléphone par BLE).
;
; Deux environnements, MÊME code : choisir selon le module en main.
;   pio run -e esp32s3_borne_n8r8 -t upload      ; 8 Mo flash, PSRAM octale
;   pio run -e esp32s3_borne_n16r8 -t upload     ; 16 Mo flash, PSRAM octale
; Module SANS PSRAM (N8 nu) : partir de _n8r8 et retirer les trois lignes
; board_build.arduino.memory_type / board_build.psram_type / -DBOARD_HAS_PSRAM.
; Le firmware fonctionne sans PSRAM (voir la réserve TLS dans main.cpp), mais
; la marge mémoire du TLS est alors aussi tendue que sur esp32dev_borne/.

[esp32s3_base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Décode les adresses d'une backtrace en noms de fonctions/lignes.
monitor_filters = esp32_exception_decoder
; PSRAM octale (suffixe R8 du module). Sur un module à PSRAM quad (R2),
; remplacer par qio_qspi / qspi.
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    -DBOARD_HAS_PSRAM
    ; `Serial` reste l'UART0 (GPIO43/44), donc le port USB "UART" du DevKitC-1
    ; (celui marqué COM/UART), comme sur esp32dev_borne/ : un moniteur série
    ; branché là survit aux redémarrages de la borne, contrairement au CDC
    ; natif qui disparaît du PC à chaque reset. Pour passer le moniteur sur le
    ; port USB natif (celui marqué USB) : ARDUINO_USB_CDC_ON_BOOT=1.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    ; Pile de la tâche loop() par défaut (8 Ko) insuffisante pour la poignée
    ; de main TLS de mbedTLS (syncWithApi() vers l'API en HTTPS) combinée aux
    ; buffers JSON locaux — voir esp32dev_borne/platformio.ini, même cause.
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    ; NimBLE allégé : la borne n'est que périphérique (serveur GATT), et ne
    ; traite qu'un téléphone à la fois (les tampons d'assemblage d'un scan
    ; sont uniques). Rôles central/observateur et connexions multiples
    ; retirés : autant de RAM rendue au tas, donc au TLS.
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    ; Serveur BLE local (§hardware) : transport téléphone<->borne. NimBLE
    ; plutôt que le BLE bluedroid natif d'Arduino-ESP32 : bien plus léger en
    ; RAM/flash.
    h2zero/NimBLE-Arduino @ ^1.4.3

[env:esp32s3_borne_n8r8]
extends = esp32s3_base
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
; Deux slots OTA de 3 Mo (le firmware pèse ~1,4 Mo : large marge) + LittleFS
; ~1,9 Mo pour la file de secours sans carte SD. Changer de table impose UN
; flash USB ; les mises à jour suivantes passent par OTA.
board_build.partitions = partitions_8mb.csv

[env:esp32s3_borne_n16r8]
extends = esp32s3_base
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
; Deux slots OTA de 4 Mo + LittleFS ~7,8 Mo : de quoi garder des milliers de
; pointages hors ligne sans carte SD.
board_build.partitions = partitions_16mb.csv
