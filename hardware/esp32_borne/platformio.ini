[env:esp32_borne]
platform = espressif32
; ESP32-S3 + caméra OV5640 (§hardware) : nécessite du PSRAM pour les frame
; buffers caméra et les documents JSON contenant la photo encodée en base64.
; Adapter `board` au module exact si besoin (ex: esp32-s3-devkitc-1-n16r8) —
; celui-ci suppose un module générique avec PSRAM octal.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Pile de la tâche loop() par défaut (8 Ko) insuffisante pour la poignée
    ; de main TLS de mbedTLS (syncWithApi() vers l'API en HTTPS) combinée aux
    ; buffers JSON locaux — provoquait un débordement de pile ("Guru
    ; Meditation Error: Double exception", crash en boucle ~15s après boot,
    ; pile décodée via `pio device monitor --filter esp32_exception_decoder`
    ; jusqu'à ecp_drbg_seed / stack_check.c).
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
