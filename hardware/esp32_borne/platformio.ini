[env:esp32_borne]
platform = espressif32
; ESP32-S3 + caméra OV5640 (§hardware) : nécessite du PSRAM pour les frame
; buffers caméra, les documents JSON contenant la photo encodée en base64, et
; désormais les modèles ESP-WHO (détection/reconnaissance faciale embarquées).
; Adapter `board` au module exact si besoin (ex: esp32-s3-devkitc-1-n16r8) —
; celui-ci suppose un module générique avec PSRAM octal.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
; Sous framework=espidf (contrairement à framework=arduino), la taille de
; flash et la table de partitions ne se déduisent PAS de board_upload.*/
; board_build.partitions — elles sont pilotées par sdkconfig.defaults/
; partitions.csv à la racine du projet (CONFIG_ESPTOOLPY_FLASHSIZE_8MB,
; CONFIG_PARTITION_TABLE_CUSTOM). Les garder ici serait trompeur (ignorés en
; silence par le build espidf), voir hardware/README.md.
; ESP-WHO (détection MTMN + reconnaissance MFN, composants Espressif) cible
; ESP-IDF, pas le framework Arduino seul. `arduino-esp32` est intégré comme
; composant IDF managé (idf_component.yml) pour conserver WiFi.h,
; HTTPClient.h, SD_MMC.h, ArduinoJson tels quels — setup()/loop() restent
; utilisables sans réécriture en app_main() pur IDF. Voir
; hardware/README.md § "Reconnaissance faciale embarquée (ESP-WHO)".
framework = espidf
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; La pile de la tâche loop() (poignée de main TLS de mbedTLS pour
    ; syncWithApi(), voir commentaire historique dans sdkconfig.defaults) se
    ; règle désormais via CONFIG_ARDUINO_LOOP_STACK_SIZE dans
    ; sdkconfig.defaults, PAS ici : sous ce mode hybride espidf+arduino-esp32,
    ; ce symbole existe aussi comme option Kconfig exposée par le composant
    ; arduino-esp32 — le définir en double ici ET dans sdkconfig.h provoque
    ; une erreur de compilation ("redefined [-Werror]").
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    ; Serveur BLE local (§hardware) : remplace le WiFi comme transport
    ; téléphone<->borne (connexion trop lente à négocier). NimBLE plutôt que
    ; le BLE bluedroid natif d'Arduino-ESP32 : bien plus léger en RAM/flash,
    ; important ici avec caméra+SD_MMC+WiFi(STA)+ESP-WHO déjà actifs
    ; simultanément.
    h2zero/NimBLE-Arduino @ ^1.4.3
