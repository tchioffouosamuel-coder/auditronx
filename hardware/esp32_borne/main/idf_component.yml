# Composants IDF managés téléchargés depuis le Component Registry Espressif.
#
# `arduino-esp32` : conserve les API Arduino (WiFi.h, HTTPClient.h, SD_MMC.h,
# setup()/loop()) au sein d'un projet ESP-IDF.
#
dependencies:
  espressif/arduino-esp32: "*"
  # `esp_camera.h` (driver OV5640) n'est pas inclus automatiquement par
  # `arduino-esp32` sous ce mode hybride.
  espressif/esp32-camera: "*"
